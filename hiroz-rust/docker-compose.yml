services:
  zenoh:
    image: eclipse/zenoh:latest
    container_name: uconsole-hiroz-zenoh
    ports:
      - "7447:7447"
      - "8000:8000"
    restart: unless-stopped

  bridge:
    build: .
    container_name: uconsole-hiroz-bridge
    depends_on:
      - zenoh
    environment:
      ZENOH_ROUTER: tcp/zenoh:7447
    ports:
      - "8765:8765"
    command: bridge
    restart: unless-stopped

  app:
    build: .
    profiles: ["tools"]
    container_name: uconsole-hiroz-app
    depends_on:
      - zenoh
      - bridge
    environment:
      ZENOH_ROUTER: tcp/zenoh:7447
    command: sim --hz 60
    restart: unless-stopped
