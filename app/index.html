<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>uConsole conveyor / camera FOV demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; }
    #app, #app canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: absolute; top: 12px; left: 12px; width: 292px;
      padding: 12px 14px; border-radius: 10px;
      background: rgba(10, 15, 20, 0.82);
      border: 1px solid #2a3947;
      color: #d7e3ee;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      backdrop-filter: blur(4px);
    }
    #hud .hudHeader { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #hud h1 { margin: 0; font-size: 14px; color: #64d2ff; }
    #hud .collapseBtn { flex: 0 0 24px; padding: 2px 0; line-height: 1; }
    body.hud-collapsed #hud { width: auto; padding: 8px 10px; }
    body.hud-collapsed #hudBody { display: none; }
    #hud .row { display: flex; justify-content: space-between; gap: 8px; }
    #hud .k { color: #8fa3b5; }
    #hud .v { color: #e8f4ff; }
    #hud .scale { color: #48e0a0; font-weight: bold; }
    #hud .btns { display: flex; gap: 6px; margin-top: 10px; }
    #hud button {
      flex: 1; cursor: pointer; padding: 6px 4px;
      background: #1c2a36; color: #d7e3ee;
      border: 1px solid #3a5062; border-radius: 6px;
      font: inherit; user-select: none;
    }
    #hud button:hover { background: #263a4a; }
    @keyframes resetHoldFill { to { background-size: 100% 100%; } }
    #hud button.holding {
      background-color: #1c2a36;
      background-image: linear-gradient(90deg, #5c4515, #ffd54a);
      background-repeat: no-repeat;
      background-size: 0% 100%;
      animation: resetHoldFill 3s linear forwards;
      color: #ffd54a;
    }
    #hud button.saved {
      background: #ffd54a;
      color: #0b0f14;
      font-weight: bold;
      animation: none;
    }
    #hud .hint { margin-top: 8px; color: #6f8292; font-size: 11px; }

    /* Vertical side tab, centred on the right edge. */
    #sidebarTab {
      position: absolute; top: 50%; right: 0; z-index: 10;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: 16px 7px;
      background: #1c2a36; color: #ffd54a;
      border: 1px solid #3a5062; border-right: none;
      border-radius: 8px 0 0 8px;
      cursor: pointer;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 2px;
      transition: right .18s ease;
    }
    #sidebarTab:hover { background: #263a4a; }
    body.sidebar-open #sidebarTab { right: 320px; }

    #sidebar {
      position: absolute; top: 0; right: 0; bottom: 0; width: 320px;
      z-index: 5; padding: 16px 12px;
      background: rgba(10, 15, 20, 0.95);
      border-left: 1px solid #2a3947;
      color: #d7e3ee;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-y: auto;
      transition: transform .18s ease;
    }
    body:not(.sidebar-open) #sidebar { transform: translateX(100%); }
    #sidebar .sec {
      border: 1px solid #2a3947; border-radius: 8px;
      padding: 8px; margin-bottom: 10px;
      background: rgba(20, 30, 40, 0.6);
    }
    #sidebar .sec h3 { margin: 0 0 8px; font-size: 12px; color: #ffd54a; }
    #sidebar .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    #sidebar label { display: block; color: #8fa3b5; font-size: 10px; }
    #sidebar input[type=number] {
      width: 100%; margin-top: 2px; padding: 3px;
      background: #111a22; border: 1px solid #33475a; border-radius: 4px;
      color: #e8f4ff; font: 11px ui-monospace, monospace;
    }
    #sidebar .check { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: #8fa3b5; font-size: 11px; }
    #sidebar .check input { accent-color: #48e0a0; }
    #sidebar .empty { color: #6f8292; font-size: 11px; line-height: 1.6; padding: 8px; }
    #sidebar .tree { font-size: 11px; }
    #sidebar .tree .item { padding: 4px 6px; border-radius: 4px; cursor: pointer; color: #bcd0e0; }
    #sidebar .tree .item:hover { background: #1c2a36; color: #e8f4ff; }
    #sidebar .tree .group { color: #ffd54a; font-weight: bold; }
    #sidebar .tree .child { padding-left: 18px; color: #8fa3b5; }
    #sidebar .tree .add { color: #48e0a0; }

    #pipWrap {
      position: absolute; right: 26px; bottom: 12px;
      padding: 6px; border-radius: 8px;
      background: rgba(10, 15, 20, 0.85);
      border: 1px solid #2a3947;
      transition: right .18s ease;
    }
    body.sidebar-open #pipWrap { right: 332px; }
    #pipWrap .pipTitle {
      color: #ffd54a; font: 11px/1.4 ui-monospace, monospace;
      margin-bottom: 4px; text-align: center;
    }
    #pipWrap .pipControls { display: flex; gap: 6px; margin-bottom: 5px; }
    #pipWrap select, #pipWrap .pipControls button {
      min-width: 0; padding: 3px 4px;
      background: #111a22; color: #e8f4ff;
      border: 1px solid #3a5062; border-radius: 4px;
      font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #pipWrap select { flex: 1; }
    #pipWrap .pipControls button { flex: 0 0 62px; cursor: pointer; }
    #pipWrap .pipControls button:hover { background: #263a4a; }
    #pip { display: block; width: 320px; height: 213px; border: 1px solid #3a5062; border-radius: 4px; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="hudHeader">
      <h1>Conveyor / camera demo</h1>
      <button id="btnHudCollapse" class="collapseBtn" type="button" title="Collapse panel" aria-expanded="true">−</button>
    </div>
    <div id="hudBody">
      <div class="row"><span class="k">source</span><span class="v" id="sourceValue">sim</span></div>
      <div class="row"><span class="k">boxes on line</span><span class="v" id="count">0</span></div>
      <div class="row"><span class="k">scale</span><span class="v scale" id="scaleValue">--- kg</span></div>
      <div class="row"><span class="k">belt speed</span><span class="v" id="speedValue">0.50 m/s</span></div>
      <div class="row"><span class="k">FOV @ plane</span><span class="v" id="fovValue">0.60 × 0.40 m</span></div>
      <div class="btns">
        <button id="btnPause">Pause</button>
        <button id="btnSpawn">Spawn</button>
        <button id="btnReset">Reset</button>
      </div>
      <div class="btns">
        <button id="btnZoomIn">Zoom +</button>
        <button id="btnZoomOut">Zoom −</button>
      </div>
      <div class="btns">
        <button id="btnToggleFov" type="button">FOV: ON</button>
        <button id="btnToggleLabels" type="button">LABELS: ON</button>
      </div>
      <div class="hint">click object = edit · drag = orbit · +/- = zoom · Space = pause · S = spawn · hold Reset 3s = save defaults</div>
    </div>
  </div>

  <button id="sidebarTab">PANEL</button>
  <aside id="sidebar"></aside>

  <div id="pipWrap">
    <div class="pipTitle" id="pipTitle">CAM 1 · live view</div>
    <div class="pipControls">
      <select id="pipCamera" aria-label="PiP camera"></select>
      <button id="btnAddCamera" type="button">+ CAM</button>
    </div>
    <canvas id="pip" width="320" height="213"></canvas>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
