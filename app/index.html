<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>uConsole conveyor / camera FOV demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; }
    #app, #app canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: absolute; top: 12px; left: 12px; width: 292px;
      padding: 12px 14px; border-radius: 10px;
      background: rgba(10, 15, 20, 0.82);
      border: 1px solid #2a3947;
      color: #d7e3ee;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      backdrop-filter: blur(4px);
    }
    #hud h1 { margin: 0 0 6px; font-size: 14px; color: #64d2ff; }
    #hud .row { display: flex; justify-content: space-between; gap: 8px; }
    #hud .k { color: #8fa3b5; }
    #hud .v { color: #e8f4ff; }
    #hud .scale { color: #48e0a0; font-weight: bold; }
    #hud .btns { display: flex; gap: 6px; margin-top: 10px; }
    #hud button {
      flex: 1; cursor: pointer; padding: 6px 4px;
      background: #1c2a36; color: #d7e3ee;
      border: 1px solid #3a5062; border-radius: 6px;
      font: inherit;
    }
    #hud button:hover { background: #263a4a; }
    #hud .hint { margin-top: 8px; color: #6f8292; font-size: 11px; }

    #pipWrap {
      position: absolute; right: 12px; bottom: 12px;
      padding: 6px; border-radius: 8px;
      background: rgba(10, 15, 20, 0.85);
      border: 1px solid #2a3947;
    }
    #pipWrap .pipTitle {
      color: #ffd54a; font: 11px/1.4 ui-monospace, monospace;
      margin-bottom: 4px; text-align: center;
    }
    #pip { display: block; width: 320px; height: 213px; border: 1px solid #3a5062; border-radius: 4px; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <h1>Conveyor / camera demo</h1>
    <div class="row"><span class="k">boxes on line</span><span class="v" id="count">0</span></div>
    <div class="row"><span class="k">scale</span><span class="v scale" id="scaleValue">--- kg</span></div>
    <div class="row"><span class="k">belt speed</span><span class="v">0.50 m/s</span></div>
    <div class="row"><span class="k">belt</span><span class="v">4.00 × 0.60 m</span></div>
    <div class="row"><span class="k">FOV @ belt</span><span class="v">0.60 × 0.40 m</span></div>
    <div class="btns">
      <button id="btnPause">Pause</button>
      <button id="btnSpawn">Spawn</button>
      <button id="btnReset">Reset</button>
    </div>
    <div class="btns">
      <button id="btnZoomIn">Zoom +</button>
      <button id="btnZoomOut">Zoom −</button>
    </div>
    <div class="hint">drag = orbit · +/- or PgUp/PgDn = zoom · Space = pause · S = spawn</div>
  </div>

  <div id="pipWrap">
    <div class="pipTitle">CAM 1 · x=2.0 m · h=1.0 m</div>
    <canvas id="pip" width="320" height="213"></canvas>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
